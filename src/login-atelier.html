<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Members’ desk · Hotel Price Hunter Atelier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100dvh;background:#f4ead8;color:#1a120c;font:16px/1.5 Figtree,Helvetica,sans-serif;
  display:grid;place-items:center;padding:48px 22px 32px;
  background-image:radial-gradient(rgba(26,18,12,.04) .8px, transparent .9px);background-size:16px 16px;
}
button,a,input{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #8a6a34;outline-offset:3px}
.hph-switch{position:fixed;top:0;left:0;right:0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px 22px;background:#efe4cd;border-bottom:1px solid rgba(26,18,12,.22);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.hph-switch .links{display:flex;gap:6px}
.hph-switch a{color:#5a5147;text-decoration:none;padding:7px 11px}
.hph-switch a[aria-current=page]{color:#1a120c;border:1px solid #1a120c;background:#fbf6ea}
.card{max-width:460px;width:100%;background:#fbf6ea;border:1px solid rgba(26,18,12,.22);padding:34px 32px;text-align:center}
.kicker{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#7a2a28;font-weight:700}
h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:clamp(28px,5vw,40px);line-height:1.05;margin:10px 0 12px}
p{color:#5a5147;margin:0 0 18px}
.seal{width:54px;height:54px;margin:0 auto 16px;border:2px solid #7a2a28;border-radius:50%;display:grid;place-items:center;color:#7a2a28;font-family:Fraunces,Georgia,serif;font-style:italic}
form{text-align:left}
label{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin:16px 0 7px}
input{width:100%;padding:12px;border:0;border-bottom:1px solid #1a120c;background:transparent}
button[type=submit]{width:100%;margin-top:24px;background:#7a2a28;color:#fbf6ea;border:0;padding:14px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.error{color:#7a2a28;background:#f6ead6;padding:10px;margin-bottom:12px}
</style>
</head>
<body>
<nav class="hph-switch" aria-label="Design versions">
  <span>Compare designs</span>
  <div class="links">
    <a data-design-link="original">Original</a>
    <a data-design-link="atelier" aria-current="page">Atelier</a>
    <a data-design-link="radar">Radar</a>
  </div>
</nav>
<main class="card">
  <div class="seal" aria-hidden="true">VIII</div>
  <p class="kicker">The members’ desk</p>
  <h1>Open the Atelier issue.</h1>
  <p>Shared credentials, please. The Phuket desk will show the stay of record and today’s revisions.</p>
  <!--LOGIN_ERROR-->
  <form action="/login" method="post">
    <input type="hidden" name="next" value="/atelier">
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required maxlength="100" autocapitalize="none">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="200">
    <button type="submit">Enter the issue</button>
  </form>
</main>
<script>
(function(){
  const file=/\.html$/i.test((location.pathname.split('/').pop()||''));
  const hrefs=file?{original:'login-original.html',atelier:'login-atelier.html',radar:'login-radar.html'}:{original:'/',atelier:'/atelier',radar:'/radar'};
  document.querySelectorAll('[data-design-link]').forEach(a=>{a.href=hrefs[a.dataset.designLink]});
})();
</script>
</body>
</html>
