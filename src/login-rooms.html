<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sign in · Rooms</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@500;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:#f1ebe3;color:#201c18;font:16px/1.45 Epilogue,Helvetica,sans-serif;padding:56px 16px 24px}
button,a,input{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #c4a56a;outline-offset:3px}
.hph-switch{position:fixed;top:0;left:0;right:0;padding:6px 12px;background:#f1ebe3;border-bottom:1px solid #e0d7cc}
.hph-switch .links{display:flex;gap:4px;overflow-x:auto}
.hph-switch a{flex:none;min-height:40px;display:grid;place-items:center;padding:0 12px;text-decoration:none;color:#6a6259;font-size:13px}
.hph-switch a[aria-current=page]{color:#201c18;background:#fffaf3;border-radius:999px}
main{max-width:400px;margin:24px auto 0}
.kicker{font-size:13px;color:#6a6259;font-weight:600}
h1{font-family:"Source Serif 4",Georgia,serif;font-size:32px;font-weight:600;letter-spacing:-.02em;margin:8px 0 10px}
p{color:#6a6259;margin:0 0 20px}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
input{width:100%;min-height:48px;padding:12px;border:1px solid #e0d7cc;border-radius:12px;background:#fffaf3}
button[type=submit]{width:100%;min-height:52px;margin-top:20px;background:#24584f;color:#fffaf3;border:0;border-radius:12px;font-weight:600}
.error{color:#24584f;background:#e4eeea;padding:12px;border-radius:10px}
</style>
</head>
<body>
<nav class="hph-switch" aria-label="Design versions"><div class="links"><a data-design-link="original">Original</a><a data-design-link="atelier">Atelier</a><a data-design-link="radar">Radar</a><a data-design-link="keep">Keep</a><a data-design-link="ledger">Ledger</a><a data-design-link="rooms" aria-current="page">Rooms</a><a data-design-link="poster">Poster</a><a data-design-link="found">Found</a><a data-design-link="vista">Vista</a></div></nav>
<main>
  <p class="kicker">Hotel Price Hunter</p>
  <h1>Browse the rooms still watching.</h1>
  <p>Shared username and password to open the prototype.</p>
  <!--LOGIN_ERROR-->
  <form action="/login" method="post">
    <input type="hidden" name="next" value="/rooms">
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required maxlength="100" autocapitalize="none">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="200">
    <button type="submit">Continue</button>
  </form>
</main>
<script>
(function(){const file=/\.html$/i.test((location.pathname.split('/').pop()||''));const hrefs=file?{original:'login-original.html',atelier:'login-atelier.html',radar:'login-radar.html',keep:'login-keep.html',ledger:'login-ledger.html',rooms:'login-rooms.html',poster:'login-poster.html',found:'login-found.html',vista:'login-vista.html'}:{original:'/',atelier:'/atelier',radar:'/radar',keep:'/keep',ledger:'/ledger',rooms:'/rooms',poster:'/poster',found:'/found',vista:'/vista'};document.querySelectorAll('[data-design-link]').forEach(a=>{a.href=hrefs[a.dataset.designLink]})})();
</script>
</body>
</html>
