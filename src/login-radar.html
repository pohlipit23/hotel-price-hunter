<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clearance · HUNTER MK-8</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;600&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100dvh;background:#efe4cc;color:#1b2744;font:15px/1.45 Outfit,Helvetica,sans-serif;
  display:grid;place-items:center;padding:56px 16px 24px;
  background-image:linear-gradient(#e7dcc6 1px,transparent 1px),linear-gradient(90deg,#e7dcc6 1px,transparent 1px);
  background-size:28px 28px;
}
button,a,input{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #2157d6;outline-offset:3px}
.hph-switch{position:fixed;top:0;left:0;right:0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px 18px;background:#efe4cc;border-bottom:3px solid #1b2744;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-family:"IBM Plex Mono",ui-monospace,monospace}
.hph-switch .links{display:flex;gap:6px}
.hph-switch a{color:#4e5a72;text-decoration:none;padding:6px 10px}
.hph-switch a[aria-current=page]{color:#1b2744;border:2px solid #1b2744;background:#fff;box-shadow:3px 3px 0 #1b2744}
.device{max-width:440px;width:100%;background:#fff8ea;border:4px solid #1b2744;border-radius:26px;padding:18px 18px 24px;box-shadow:8px 8px 0 #1b2744}
.status{background:#1b2744;color:#fff8ea;padding:9px 12px;border-radius:14px 14px 6px 6px;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.08em;display:flex;justify-content:space-between}
h1{font-family:"Archivo Black",Impact,sans-serif;font-size:28px;margin:16px 0 8px;line-height:1}
p{color:#4e5a72;margin:0 0 12px}
label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;margin:14px 0 6px}
input{width:100%;padding:12px;border:3px solid #1b2744;border-radius:10px;background:#fff}
button[type=submit]{width:100%;margin-top:18px;background:#e54816;color:#fff;border:3px solid #1b2744;padding:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;box-shadow:4px 4px 0 #1b2744;border-radius:12px}
.error{color:#e54816;background:#ffe3d2;border:3px solid #1b2744;padding:10px;border-radius:10px}
.boot{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;color:#0f8a62;background:#1b2744;padding:10px 12px;border-radius:10px;margin:10px 0 14px}
</style>
</head>
<body>
<nav class="hph-switch" aria-label="Design versions">
  <span>Channel select</span>
  <div class="links"><a data-design-link="original">Original</a><a data-design-link="atelier">Atelier</a><a data-design-link="radar" aria-current="page">Radar</a><a data-design-link="keep">Keep</a><a data-design-link="ledger">Ledger</a><a data-design-link="rooms">Rooms</a><a data-design-link="poster">Poster</a><a data-design-link="found">Found</a><a data-design-link="vista">Vista</a></div>
</nav>
<main class="device">
  <div class="status"><span>HUNTER MK-8</span><span>INSERT CLEARANCE</span></div>
  <p class="boot">BOOT OK · WAITING FOR ACCESS CODE_</p>
  <h1>View your stay options.</h1>
  <p>Enter the shared username and password to power the prototype.</p>
  <!--LOGIN_ERROR-->
  <form action="/login" method="post">
    <input type="hidden" name="next" value="/radar">
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required maxlength="100" autocapitalize="none">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="200">
    <button type="submit">Power on</button>
  </form>
</main>
<script>
(function(){
  const file=/\.html$/i.test((location.pathname.split('/').pop()||''));
  const hrefs=file?{original:'login-original.html',atelier:'login-atelier.html',radar:'login-radar.html',keep:'login-keep.html',ledger:'login-ledger.html',rooms:'login-rooms.html',poster:'login-poster.html',found:'login-found.html',vista:'login-vista.html'}:{original:'/',atelier:'/atelier',radar:'/radar',keep:'/keep',ledger:'/ledger',rooms:'/rooms',poster:'/poster',found:'/found',vista:'/vista'};
  document.querySelectorAll('[data-design-link]').forEach(a=>{a.href=hrefs[a.dataset.designLink]});
})();
</script>
</body>
</html>
